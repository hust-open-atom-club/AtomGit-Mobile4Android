name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现步骤与环境信息，方便定位问题。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？期望的行为是什么？
      placeholder: 描述你看到的现象与期望结果的差异
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出最小复现步骤
      placeholder: |
        1. 打开应用并登录
        2. 切换到「待办」入口
        3. ...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 实测设备、系统版本、是否模拟器
      placeholder: 例如 Pixel 8 / Android 15 / 模拟器
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 v0.1.0 (1) 或 commit hash
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志、崩溃堆栈或截图。请先删除 Token、凭据等敏感信息。
      render: shell
    validations:
      required: false
